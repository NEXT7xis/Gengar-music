          body{background:var(--bg);color:var(--ink);font:16px/1.4 "Trebuchet MS",system-ui,sans-serif;min-height:100vh;padding:8px 16px 0;overflow-x:hidden;background-image:radial-gradient(1.5px 1.5px at 12% 8%,#fff,transparent),radial-gradient(1px 1px at 80% 14%,#fff,transparent),radial-gradient(2px 2px at 40% 30%,#cdbbff,transparent),radial-gradient(1px 1px at 90% 45%,#fff,transparent),radial-gradient(1.5px 1.5px at 18% 62%,#fff,transparent),radial-gradient(1px 1px at 66% 78%,#fff,transparent),linear-gradient(#1a0b3a 0,var(--bg) 360px)}
