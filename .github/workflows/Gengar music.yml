          const fav=()=>tf(Q[qi]);
          function sendArt(){try{const x=new XMLSerializer().serializeToString(document.querySelector('.art')).replace('<svg ','<svg width="960" height="736" '),im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=512;const g=c.getContext('2d'),r=g.createLinearGradient(0,0,0,512);r.addColorStop(0,'#2a1060');r.addColorStop(1,'#05030a');g.fillStyle=r;g.fillRect(0,0,512,512);g.drawImage(im,16,104,480,368);Android.art(c.toDataURL('image/jpeg',.85).split(',')[1])};im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(x)}catch(e){}}
          window.gmCmd=c=>{if(c=='play'){au.src?au.play():$('pl').click()}else if(c=='pause')au.pause();else if(c=='next')step(1);else if(c=='prev')step(-1);else if(c=='fav')fav();else if(c=='shuf')$('sh').click();else if(c.indexOf('seek:')==0)au.currentTime=+c.slice(5)/1000};
          $('f').onchange=e=>{for(const f of e.target.files){const id=Date.now()+Math.random().toString(36).slice(2,6);put(id,f);S.songs.push({id,n:f.name.replace(/\.[^.]+$/,'')})}const n=e.target.files.length;save();draw();$('a').textContent=n+(n>1?' músicas adicionadas':' música adicionada');e.target.value=''};
          async function play(i,q){if(q)Q=q;qi=i;const id=Q[i],s=S.songs.find(x=>x.id==id),b=await get(id);if(!s||!b){$('a').textContent='Arquivo não encontrado. Adicione a música de novo.';return}au.src=URL.createObjectURL(b);au.play();S.hist=[id,...S.hist.filter(x=>x!=id)].slice(0,50);save();$('t').textContent=s.n;$('a').textContent='Gengar Music';draw()}
