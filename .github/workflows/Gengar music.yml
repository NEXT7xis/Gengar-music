          $('pl').onclick=()=>au.src?(au.paused?au.play():au.pause()):S.songs.length&&play(0,S.songs.map(x=>x.id));
          $('nx').onclick=()=>step(1);$('pv').onclick=()=>step(-1);$('fv').onclick=fav;
          $('fpa').onclick=()=>{const v=FV();if(v.length)play(0,v)};
          $('sh').onclick=e=>{e.currentTarget.classList.toggle('on',sh=!sh);ms()};
          $('rp').onclick=e=>e.currentTarget.classList.toggle('on',rp=!rp);
          au.onplay=au.onpause=()=>{$('pl').textContent=au.paused?'▶':'⏸';ms()};
