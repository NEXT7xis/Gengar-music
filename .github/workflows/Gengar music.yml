          package com.gengar.music;

          import android.Manifest;
          import android.app.Activity;
          import android.content.ClipData;
          import android.content.Context;
          import android.content.Intent;
          import android.content.MutableContextWrapper;
          import android.content.SharedPreferences;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.PowerManager;
          import android.provider.Settings;
          import android.util.Base64;
          import android.view.ViewGroup;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.RandomAccessFile;
          import java.net.HttpURLConnection;
          import java.net.URL;

          public class MainActivity extends Activity {
            static MainActivity inst;
            static WebView web;
            static MutableContextWrapper wctx;
            static Context app;
            static ValueCallback<Uri[]> cb;
            static final Handler UI = new Handler(Looper.getMainLooper());

            static void js(final String c) {
              if (web == null) return;
              UI.post(() -> web.evaluateJavascript("window.gmCmd&&gmCmd('" + c + "')", null));
            }

            @Override protected void onCreate(Bundle b) {
              super.onCreate(b);
              inst = this;
              app = getApplicationContext();
              int bg = Color.parseColor("#05030A");
              getWindow().setStatusBarColor(bg);
              getWindow().setNavigationBarColor(bg);
              if (web == null) {
                wctx = new MutableContextWrapper(app);
                web = new WebView(wctx);
                web.setBackgroundColor(bg);
                WebSettings s = web.getSettings();
                s.setJavaScriptEnabled(true);
                s.setDomStorageEnabled(true);
                s.setMediaPlaybackRequiresUserGesture(false);
                web.addJavascriptInterface(new Bridge(), "Android");
                web.setWebChromeClient(new WebChromeClient() {
                  @Override public boolean onShowFileChooser(WebView w, ValueCallback<Uri[]> c, FileChooserParams p) {
                    MainActivity a = inst;
                    if (a == null) return false;
                    if (cb != null) cb.onReceiveValue(null);
                    cb = c;
                    Intent i = new Intent(Intent.ACTION_GET_CONTENT);
                    i.addCategory(Intent.CATEGORY_OPENABLE);
                    i.setType("audio/*");
                    i.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true);
                    try { a.startActivityForResult(i, 11); } catch (Exception e) { cb = null; return false; }
                    return true;
                  }
                });
                web.loadUrl("file:///android_asset/index.html");
              }
              wctx.setBaseContext(this);
              if (web.getParent() != null) ((ViewGroup) web.getParent()).removeView(web);
              setContentView(web);
              if (Build.VERSION.SDK_INT >= 33) requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, 1);
              else askBattery();
            }

            @Override public void onRequestPermissionsResult(int rq, String[] p, int[] r) {
              super.onRequestPermissionsResult(rq, p, r);
              askBattery();
            }

            void askBattery() {
              try {
                SharedPreferences sp = getSharedPreferences("gm", MODE_PRIVATE);
                if (sp.getBoolean("bat", false)) return;
                sp.edit().putBoolean("bat", true).apply();
                PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                if (!pm.isIgnoringBatteryOptimizations(getPackageName())) {
                  startActivity(new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS, Uri.parse("package:" + getPackageName())));
                }
              } catch (Exception e) { }
            }

            @Override protected void onActivityResult(int rq, int rs, Intent d) {
              super.onActivityResult(rq, rs, d);
              if (rq == 11 && cb != null) {
                Uri[] r = null;
                if (rs == RESULT_OK && d != null) {
                  ClipData cd = d.getClipData();
                  if (cd != null) {
                    r = new Uri[cd.getItemCount()];
                    for (int i = 0; i < r.length; i++) r[i] = cd.getItemAt(i).getUri();
                  } else if (d.getData() != null) {
                    r = new Uri[]{d.getData()};
                  }
                }
                cb.onReceiveValue(r);
                cb = null;
              }
            }

            @Override public void onBackPressed() { moveTaskToBack(true); }

            @Override protected void onDestroy() {
              if (web != null && web.getParent() != null) ((ViewGroup) web.getParent()).removeView(web);
              if (wctx != null) wctx.setBaseContext(app);
              if (inst == this) inst = null;
              super.onDestroy();
            }

            static String esc(String s) {
              return s.replace("\\", "\\\\").replace("\"", "\\\"").replace("\n", " ").replace("\r", " ");
            }

            static String safe(String s) { return s.replaceAll("[^A-Za-z0-9_]", ""); }

            static class Bridge {
              @JavascriptInterface public void get(final String url, final String id) {
                new Thread(() -> {
                  String r;
                  try { r = download(url, safe(id)); }
                  catch (Exception e) { r = "{\"ok\":false,\"err\":\"" + esc(String.valueOf(e.getMessage())) + "\"}"; }
                  final String res = r;
                  UI.post(() -> web.evaluateJavascript("gmDone('" + id + "'," + res + ")", null));
                }).start();
              }

              @JavascriptInterface public String chunk(String id, int off, int len) {
                try (RandomAccessFile f = new RandomAccessFile(new File(app.getCacheDir(), safe(id)), "r")) {
                  f.seek(off);
                  byte[] buf = new byte[len];
                  int n = f.read(buf);
                  if (n <= 0) return "";
                  return Base64.encodeToString(buf, 0, n, Base64.NO_WRAP);
                } catch (Exception e) { return ""; }
              }

              @JavascriptInterface public void del(String id) { new File(app.getCacheDir(), safe(id)).delete(); }

              @JavascriptInterface public void media(String title, String artist, boolean playing, int posMs, int durMs, boolean shuffle, boolean fav) {
                MusicService.title = title;
                MusicService.artist = artist;
                MusicService.playing = playing;
                MusicService.pos = posMs;
                MusicService.dur = durMs;
                MusicService.shuffle = shuffle;
                MusicService.fav = fav;
                UI.post(() -> MusicService.push(app));
              }

              @JavascriptInterface public void art(String b64) {
                try {
                  byte[] d = Base64.decode(b64, Base64.DEFAULT);
                  Bitmap bm = BitmapFactory.decodeByteArray(d, 0, d.length);
                  if (bm != null) MusicService.art = bm;
                } catch (Exception e) { }
              }
            }

            static String download(String u, String id) throws Exception {
              String cur = u;
              HttpURLConnection c = null;
              for (int i = 0; i < 8; i++) {
                c = (HttpURLConnection) new URL(cur).openConnection();
                c.setInstanceFollowRedirects(false);
                c.setConnectTimeout(15000);
                c.setReadTimeout(30000);
                c.setRequestProperty("User-Agent", "Mozilla/5.0 GengarMusic");
                int code = c.getResponseCode();
                if (code >= 300 && code < 400) {
                  String l = c.getHeaderField("Location");
                  c.disconnect();
                  if (l == null) throw new Exception("HTTP " + code);
                  cur = new URL(new URL(cur), l).toString();
                  continue;
                }
                if (code >= 400) throw new Exception("HTTP " + code);
                break;
              }
              String t = c.getContentType();
              if (t == null) t = "";
              if (t.startsWith("text/")) throw new Exception("O link nao e de um arquivo de audio");
              InputStream in = c.getInputStream();
              FileOutputStream out = new FileOutputStream(new File(app.getCacheDir(), id));
              byte[] buf = new byte[32768];
              int n;
              long size = 0;
              while ((n = in.read(buf)) != -1) { out.write(buf, 0, n); size += n; }
              out.close();
              in.close();
              return "{\"ok\":true,\"size\":" + size + ",\"type\":\"" + esc(t.split(";")[0].trim()) + "\"}";
            }
          }
