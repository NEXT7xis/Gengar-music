          cat > app/src/main/java/com/gengar/music/MusicService.java <<'EOF'
          package com.gengar.music;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.graphics.Bitmap;
          import android.media.MediaMetadata;
          import android.media.session.MediaSession;
          import android.media.session.PlaybackState;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.IBinder;
          import android.os.PowerManager;
          import android.os.SystemClock;

          public class MusicService extends Service {
            static MusicService inst;
            static String title = "Gengar Music", artist = "Gengar Music";
            static boolean playing, shuffle, fav;
            static long pos, dur;
            static Bitmap art;
            static final int ID = 7;
            static final String CH = "gm_media";
            MediaSession session;
            NotificationManager nm;
            PowerManager.WakeLock wl;
            boolean fg;

            static void push(Context c) {
              if (inst == null) {
                Intent i = new Intent(c, MusicService.class);
                try {
                  if (Build.VERSION.SDK_INT >= 26) c.startForegroundService(i); else c.startService(i);
                } catch (Exception e) { }
              } else inst.refresh(false);
            }

            @Override public void onCreate() {
              super.onCreate();
              inst = this;
              nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
              if (Build.VERSION.SDK_INT >= 26) {
                NotificationChannel ch = new NotificationChannel(CH, "Reprodução", NotificationManager.IMPORTANCE_LOW);
                ch.setShowBadge(false);
                nm.createNotificationChannel(ch);
              }
              session = new MediaSession(this, "GengarMusic");
              session.setCallback(new MediaSession.Callback() {
                @Override public void onPlay() { MainActivity.js("play"); }
                @Override public void onPause() { MainActivity.js("pause"); }
                @Override public void onStop() { MainActivity.js("pause"); }
                @Override public void onSkipToNext() { MainActivity.js("next"); }
                @Override public void onSkipToPrevious() { MainActivity.js("prev"); }
                @Override public void onSeekTo(long p) { MainActivity.js("seek:" + p); }
                @Override public void onCustomAction(String a, Bundle e) { MainActivity.js(a); }
              });
              session.setActive(true);
              PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
              wl = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "gengar:music");
              wl.setReferenceCounted(false);
            }

            @Override public int onStartCommand(Intent i, int f, int s) {
              String a = i == null ? null : i.getAction();
              if (a != null && a.startsWith("gm.")) MainActivity.js(a.substring(3));
              else refresh(true);
              return START_NOT_STICKY;
            }

            @Override public IBinder onBind(Intent i) { return null; }

            @Override public void onTaskRemoved(Intent i) { if (!playing) stopSelf(); }

            @Override public void onDestroy() {
              inst = null;
              if (wl != null && wl.isHeld()) wl.release();
              session.release();
              super.onDestroy();
            }

            void refresh(boolean force) {
              updateSession();
              Notification n = build();
              if (playing || force) {
                try {
                  if (Build.VERSION.SDK_INT >= 29) startForeground(ID, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK);
                  else startForeground(ID, n);
                  fg = true;
                } catch (Exception e) { nm.notify(ID, n); }
              } else {
                if (fg) { stopForeground(false); fg = false; }
                nm.notify(ID, n);
              }
              if (playing) { if (!wl.isHeld()) wl.acquire(10L * 60 * 60 * 1000); }
              else if (wl.isHeld()) wl.release();
            }

            void updateSession() {
              MediaMetadata.Builder m = new MediaMetadata.Builder()
                .putString(MediaMetadata.METADATA_KEY_TITLE, title)
                .putString(MediaMetadata.METADATA_KEY_ARTIST, artist)
                .putLong(MediaMetadata.METADATA_KEY_DURATION, dur);
              if (art != null) {
                m.putBitmap(MediaMetadata.METADATA_KEY_ALBUM_ART, art);
                m.putBitmap(MediaMetadata.METADATA_KEY_ART, art);
              }
              session.setMetadata(m.build());
              long acts = PlaybackState.ACTION_PLAY | PlaybackState.ACTION_PAUSE | PlaybackState.ACTION_PLAY_PAUSE
                | PlaybackState.ACTION_SKIP_TO_NEXT | PlaybackState.ACTION_SKIP_TO_PREVIOUS
                | PlaybackState.ACTION_SEEK_TO | PlaybackState.ACTION_STOP;
              PlaybackState.Builder p = new PlaybackState.Builder()
                .setActions(acts)
                .setState(playing ? PlaybackState.STATE_PLAYING : PlaybackState.STATE_PAUSED, pos, playing ? 1f : 0f, SystemClock.elapsedRealtime())
                .addCustomAction(new PlaybackState.CustomAction.Builder("fav", "Curtir", fav ? R.drawable.ic_heart_on : R.drawable.ic_heart).build())
                .addCustomAction(new PlaybackState.CustomAction.Builder("shuf", "Aleatório", shuffle ? R.drawable.ic_shuffle_on : R.drawable.ic_shuffle).build());
              session.setPlaybackState(p.build());
            }

            PendingIntent pi(String c) {
              Intent i = new Intent(this, MusicService.class).setAction("gm." + c);
              return PendingIntent.getService(this, c.hashCode(), i, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
            }

            Notification build() {
              Notification.Builder b = Build.VERSION.SDK_INT >= 26 ? new Notification.Builder(this, CH) : new Notification.Builder(this);
              Intent open = new Intent(this, MainActivity.class).setFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
              b.setSmallIcon(R.drawable.ic_notif)
                .setContentTitle(title)
                .setContentText(artist)
                .setOngoing(playing)
                .setShowWhen(false)
                .setVisibility(Notification.VISIBILITY_PUBLIC)
                .setContentIntent(PendingIntent.getActivity(this, 0, open, PendingIntent.FLAG_IMMUTABLE))
                .addAction(fav ? R.drawable.ic_heart_on : R.drawable.ic_heart, "Curtir", pi("fav"))
                .addAction(android.R.drawable.ic_media_previous, "Anterior", pi("prev"))
                .addAction(playing ? android.R.drawable.ic_media_pause : android.R.drawable.ic_media_play, playing ? "Pausar" : "Tocar", pi(playing ? "pause" : "play"))
                .addAction(android.R.drawable.ic_media_next, "Próxima", pi("next"))
                .addAction(shuffle ? R.drawable.ic_shuffle_on : R.drawable.ic_shuffle, "Aleatório", pi("shuf"))
                .setStyle(new Notification.MediaStyle().setMediaSession(session.getSessionToken()).setShowActionsInCompactView(1, 2, 3));
              if (art != null) b.setLargeIcon(art);
              return b.build();
            }
          }
