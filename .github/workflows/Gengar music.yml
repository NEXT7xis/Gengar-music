          try{const o=indexedDB.open('gm',1);o.onupgradeneeded=()=>o.result.createObjectStore('b');o.onsuccess=()=>{db=o.result}}catch(e){}
          const put=(id,b)=>{B[id]=b;try{db.transaction('b','readwrite').objectStore('b').put(b,id)}catch(e){}};
          const get=id=>B[id]?Promise.resolve(B[id]):new Promise(r=>{try{const q=db.transaction('b').objectStore('b').get(id);q.onsuccess=()=>r(q.result);q.onerror=()=>r()}catch(e){r()}});
          const ms=()=>{try{const s=S.songs.find(x=>x.id==Q[qi]);Android.media(s?(s.t||s.n):$('t').textContent,(s&&s.by)||'Gengar Music',!au.paused,Math.round((au.currentTime||0)*1000),Math.round((isFinite(au.duration)?au.duration:0)*1000),!!sh,!!(s&&S.fav.includes(s.id)))}catch(e){}};
          const FV=()=>S.fav.filter(i=>S.songs.some(x=>x.id==i));
