# Gengar Music: este arquivo cria o app Android inteiro e compila o APK.
# Salve em .github/workflows/compilar.yml, confirme e abra a aba Actions.
name: Compilar Gengar Music
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Criar o projeto Android
        run: |
          mkdir -p app/src/main/assets app/src/main/java/com/gengar/music app/src/main/res/drawable
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'GengarMusic'
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.gengar.music'
            compileSdk 34
            defaultConfig { applicationId 'com.gengar.music'; minSdk 24; targetSdk 34; versionCode 1; versionName '1.0' }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:label="Gengar Music" android:icon="@drawable/ic" android:theme="@android:style/Theme.Material.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > app/src/main/res/drawable/ic.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#0A0614" android:pathData="M0,0h108v108h-108z"/>
            <path android:fillColor="#6B3FD4" android:pathData="M22,40L30,14L46,34Q54,32 62,34L78,14L86,40Q96,60 84,76Q54,96 24,76Q12,60 22,40Z"/>
            <path android:fillColor="#E8265A" android:pathData="M34,50L50,56L44,64ZM74,50L58,56L64,64Z"/>
            <path android:fillColor="#FFFFFF" android:pathData="M30,66Q54,78 78,66Q74,86 54,88Q34,86 30,66Z"/>
          </vector>
          EOF
          cat > app/src/main/java/com/gengar/music/MainActivity.java <<'EOF'
          package com.gengar.music;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.*;

          public class MainActivity extends Activity {
            WebView w;
            ValueCallback<Uri[]> cb;

            protected void onCreate(Bundle b) {
              super.onCreate(b);
              getWindow().setStatusBarColor(0xFF05030A);
              getWindow().setNavigationBarColor(0xFF05030A);
              w = new WebView(this);
              w.setBackgroundColor(0xFF05030A);
              setContentView(w);
              WebSettings s = w.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setMediaPlaybackRequiresUserGesture(false);
              w.setWebChromeClient(new WebChromeClient() {
                public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> c, FileChooserParams p) {
                  if (cb != null) cb.onReceiveValue(null);
                  cb = c;
                  Intent i = new Intent(Intent.ACTION_GET_CONTENT);
                  i.addCategory(Intent.CATEGORY_OPENABLE);
                  i.setType("audio/*");
                  i.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true);
                  startActivityForResult(i, 1);
                  return true;
                }
              });
              w.loadUrl("file:///android_asset/index.html");
            }

            protected void onActivityResult(int r, int c, Intent d) {
              if (cb == null) return;
              Uri[] u = null;
              if (c == RESULT_OK && d != null) {
                if (d.getClipData() != null) {
                  int n = d.getClipData().getItemCount();
                  u = new Uri[n];
                  for (int k = 0; k < n; k++) u[k] = d.getClipData().getItemAt(k).getUri();
                } else if (d.getData() != null) {
                  u = new Uri[]{d.getData()};
                }
              }
              cb.onReceiveValue(u);
              cb = null;
            }

            public void onBackPressed() { moveTaskToBack(true); }
          }
          EOF
          cat > app/src/main/assets/index.html <<'EOF'
          <!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Gengar Music</title>
          <style>
          :root{--bg:#05030a;--navy:#17124a;--pur:#8a5cff;--mag:#d94fd8;--red:#e8265a;--ink:#f3ecff;--dim:#9b8fc4}
          *{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
          body{background:var(--bg);color:var(--ink);font:16px/1.4 "Trebuchet MS",system-ui,sans-serif;min-height:100vh;padding:8px 16px 0;overflow-x:hidden;background-image:radial-gradient(1.5px 1.5px at 12% 8%,#fff,transparent),radial-gradient(1px 1px at 80% 14%,#fff,transparent),radial-gradient(2px 2px at 40% 30%,#cdbbff,transparent),radial-gradient(1px 1px at 90% 45%,#fff,transparent),radial-gradient(1.5px 1.5px at 18% 62%,#fff,transparent),radial-gradient(1px 1px at 66% 78%,#fff,transparent),linear-gradient(#1a0b3a 0,var(--bg) 360px)}
          .hero{position:relative;text-align:center;padding-top:16px}
          .moon{position:absolute;top:22px;right:8px;width:26px;height:26px;border-radius:50%;box-shadow:-7px 4px 0 0 #ffe9a8}
          .art{width:100%;max-width:340px}
          h1{font-size:46px;letter-spacing:2px;line-height:1.1;background:linear-gradient(90deg,#ff3d8b,#b24fe0);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}
          .hero p{color:var(--dim)}
          .card{position:relative;margin:22px 0 18px;padding:22px 18px 14px;border:2px solid var(--pur);border-radius:22px;background:rgba(23,18,74,.55)}
          .tag{position:absolute;top:-14px;left:16px;background:var(--mag);color:#1a0626;font-weight:800;padding:2px 10px;border-radius:4px}
          .tt{font-size:20px;font-weight:700}.sub{color:var(--dim);font-size:14px;margin-bottom:10px}
          input[type=range]{width:100%;accent-color:var(--red)}
          .tm{display:flex;justify-content:space-between;color:var(--dim);font-size:13px}
          .ctl{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
          button{font:inherit;color:var(--ink);background:none;border:0}
          .ctl button{font-size:24px;width:48px;height:48px;border-radius:50%;color:var(--dim)}
          .ctl .on{color:var(--mag)}
          .ctl .big{background:var(--red);color:#fff;width:64px;height:64px;font-size:28px;box-shadow:0 0 24px rgba(232,38,90,.5)}
          nav{display:flex;gap:8px;margin-bottom:12px}
          nav button{flex:1;padding:10px;border-radius:12px;background:var(--navy);color:var(--dim)}
          nav .on{background:var(--pur);color:#fff}
          .add,.mk button,.go{display:block;text-align:center;padding:12px;border-radius:12px;background:var(--mag);color:#1a0626;font-weight:700;margin-bottom:12px}
          ul{list-style:none}
          li{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px;margin-bottom:6px;border-radius:12px;background:rgba(23,18,74,.6)}
          li.now{outline:2px solid var(--red)}
          .nm{flex:1;min-width:0;text-align:left;padding:6px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
          select{max-width:110px;background:var(--bg);color:var(--dim);border:1px solid var(--pur);border-radius:8px;padding:6px}
          .mk{display:flex;gap:8px}
          .mk input{flex:1;min-width:0;padding:12px;border-radius:12px;border:1px solid var(--pur);background:var(--bg);color:var(--ink)}
          .mk button,.go{margin:0}.go{padding:8px 14px}.mk button{margin-bottom:12px}
          .tr,.empty{color:var(--dim);font-size:13px;width:100%}
          small{pointer-events:none;color:var(--dim)}
          .fence{height:70px;margin:28px -16px 0;background:repeating-linear-gradient(90deg,#000 0 7px,transparent 7px 20px),linear-gradient(#0000,#6b3fd4aa)}
          .fl{animation:fl 3s ease-in-out infinite alternate}@keyframes fl{to{transform:translateY(-8px)}}
          @media(prefers-reduced-motion:reduce){.fl{animation:none}}
          </style></head><body>
          <header class="hero"><div class="moon"></div>
          <svg class="art" viewBox="0 0 300 230" role="img" aria-label="Gengar e Gastly">
          <defs><symbol id="f" viewBox="0 0 30 50"><path d="M12 46C-4 36 8 22 14 6c2 12 16 16 12 30-2 8-8 12-14 10z" fill="#d94fd8"/></symbol></defs>
          <path d="M40 120C20 80 60 40 90 56 110 20 170 24 196 52c40-14 76 30 58 72 20 30-6 80-50 76-20 24-84 28-110 6-34 6-60-20-54-52z" fill="#7b4be0" opacity=".85"/>
          <g fill="#7b4be0"><circle cx="30" cy="70" r="5"/><circle cx="272" cy="60" r="4"/><circle cx="264" cy="200" r="6"/><circle cx="14" cy="176" r="3"/></g>
          <path d="M80 70L100 20l28 42q22-7 44 0l28-42 20 50q25 40 5 80-75 45-150 0-20-40 5-80z" fill="#2a1650" stroke="#0c0618" stroke-width="3"/>
          <path d="M100 92l38 14-14 16zM200 92l-38 14 14 16z" fill="#e8265a"/>
          <path d="M90 125q60 25 120 0-5 45-60 51-55-6-60-51z" fill="#fff"/>
          <path d="M120 142v30M150 146v32M180 142v30" stroke="#2a1650" stroke-width="3"/>
          <circle cx="56" cy="164" r="30" fill="#120a26" stroke="#7b4be0" stroke-width="3"/>
          <path d="M38 152l18 10-10 8zM74 152l-18 10 10 8z" fill="#fff"/><path d="M44 180q12 7 24 0" stroke="#e8265a" stroke-width="4" fill="none"/>
          <use href="#f" class="fl" x="14" y="14" width="26" height="42"/><use href="#f" class="fl" x="246" y="10" width="22" height="36"/><use href="#f" class="fl" x="214" y="170" width="24" height="40"/>
          </svg>
          <h1>ゲンガー</h1><p>Gengar Music</p></header>
          <section class="card"><span class="tag">#094</span>
          <div id="t" class="tt">Nenhuma música</div><div id="a" class="sub">Adicione músicas do celular</div>
          <input type="range" id="p" min="0" max="1000" value="0" aria-label="Posição">
          <div class="tm"><span id="c">0:00</span><span id="d">0:00</span></div>
          <div class="ctl"><button id="sh" aria-label="Aleatório">⇄</button><button id="pv" aria-label="Anterior">⏮</button><button id="pl" class="big" aria-label="Tocar">▶</button><button id="nx" aria-label="Próxima">⏭</button><button id="rp" aria-label="Repetir">↻</button></div>
          <audio id="au"></audio></section>
          <nav><button class="on" data-v="s">Músicas</button><button data-v="l">Playlists</button></nav>
          <main id="s"><label class="add">Adicionar músicas<input type="file" id="f" accept="audio/*" multiple hidden></label><ul id="sl"></ul></main>
          <main id="l" hidden><div class="mk"><input id="pn" placeholder="Nome da playlist"><button id="pc">Criar</button></div><ul id="ll"></ul></main>
          <div class="fence"></div>
          <script>
          const $=i=>document.getElementById(i),au=$('au'),B={};
          let S={songs:[],lists:[]},Q=[],qi=-1,sh=0,rp=0,db;
          try{S=JSON.parse(localStorage.gm)}catch(e){}
          const save=()=>{try{localStorage.gm=JSON.stringify(S)}catch(e){}};
          const esc=s=>s.replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
          const fm=s=>isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';
          try{const o=indexedDB.open('gm',1);o.onupgradeneeded=()=>o.result.createObjectStore('b');o.onsuccess=()=>{db=o.result}}catch(e){}
          const put=(id,b)=>{B[id]=b;try{db.transaction('b','readwrite').objectStore('b').put(b,id)}catch(e){}};
          const get=id=>B[id]?Promise.resolve(B[id]):new Promise(r=>{try{const q=db.transaction('b').objectStore('b').get(id);q.onsuccess=()=>r(q.result);q.onerror=()=>r()}catch(e){r()}});
          $('f').onchange=e=>{for(const f of e.target.files){const id=Date.now()+Math.random().toString(36).slice(2,6);put(id,f);S.songs.push({id,n:f.name.replace(/\.[^.]+$/,'')})}save();draw();e.target.value=''};
          async function play(i,q){if(q)Q=q;qi=i;const id=Q[i],s=S.songs.find(x=>x.id==id),b=await get(id);if(!s||!b){$('a').textContent='Arquivo não encontrado. Adicione a música de novo.';return}au.src=URL.createObjectURL(b);au.play();$('t').textContent=s.n;$('a').textContent='Gengar Music';draw()}
          const step=d=>{if(Q.length)play(sh?Math.floor(Math.random()*Q.length):(qi+d+Q.length)%Q.length)};
          $('pl').onclick=()=>au.src?(au.paused?au.play():au.pause()):S.songs.length&&play(0,S.songs.map(x=>x.id));
          $('nx').onclick=()=>step(1);$('pv').onclick=()=>step(-1);
          $('sh').onclick=e=>e.currentTarget.classList.toggle('on',sh=!sh);
          $('rp').onclick=e=>e.currentTarget.classList.toggle('on',rp=!rp);
          au.onplay=au.onpause=()=>$('pl').textContent=au.paused?'▶':'⏸';
          au.onended=()=>(qi<Q.length-1||sh||rp)&&step(1);
          au.ontimeupdate=()=>{$('c').textContent=fm(au.currentTime);$('d').textContent=fm(au.duration);$('p').value=au.duration?au.currentTime/au.duration*1000:0};
          $('p').oninput=e=>au.duration&&(au.currentTime=e.target.value/1000*au.duration);
          document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x==b));$('s').hidden=b.dataset.v!='s';$('l').hidden=b.dataset.v!='l'});
          $('pc').onclick=()=>{const n=$('pn').value.trim();if(n){S.lists.push({n,ids:[]});$('pn').value='';save();draw()}};
          document.onclick=e=>{const t=e.target;if(t.dataset.p)play(+t.dataset.p,S.songs.map(x=>x.id));if(t.dataset.l){const l=S.lists[t.dataset.l];if(l.ids.length)play(0,[...l.ids])}};
          document.onchange=e=>{const t=e.target;if(t.dataset.a&&t.value!==''){const l=S.lists[t.value];if(!l.ids.includes(t.dataset.a))l.ids.push(t.dataset.a);save();draw()}};
          function draw(){const cur=Q[qi],nm=id=>(S.songs.find(x=>x.id==id)||{n:'?'}).n;
          $('sl').innerHTML=S.songs.length?S.songs.map((s,i)=>`<li class="${s.id==cur?'now':''}"><button class="nm" data-p="${i}">${esc(s.n)}</button><select data-a="${s.id}"><option value="">＋ playlist</option>${S.lists.map((l,j)=>`<option value="${j}">${esc(l.n)}</option>`).join('')}</select></li>`).join(''):'<li class="empty">Nenhuma música ainda. Toque em Adicionar músicas e escolha arquivos do celular.</li>';
          $('ll').innerHTML=S.lists.length?S.lists.map((l,j)=>`<li><b class="nm">${esc(l.n)}</b><button class="go" data-l="${j}">Tocar</button><div class="tr">${l.ids.length?esc(l.ids.map(nm).join(', ')):'Vazia. Use ＋ playlist na aba Músicas.'}</div></li>`).join(''):'<li class="empty">Crie sua primeira playlist.</li>'}
          draw();
          </script></body></html>
          EOF
      - name: Compilar o APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Gengar-Music-APK
          path: app/build/outputs/apk/debug/app-debug.apk
