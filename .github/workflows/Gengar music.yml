          au.onended=()=>(qi<Q.length-1||sh||rp)&&step(1);
          au.ontimeupdate=()=>{$('c').textContent=fm(au.currentTime);$('d').textContent=fm(au.duration);$('p').value=au.duration?au.currentTime/au.duration*1000:0};
          $('p').oninput=e=>au.duration&&(au.currentTime=e.target.value/1000*au.duration);
          document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x==b));$('s').hidden=b.dataset.v!='s';$('l').hidden=b.dataset.v!='l';$('dw').hidden=b.dataset.v!='dw';$('hs').hidden=b.dataset.v!='hs';$('fa').hidden=b.dataset.v!='fa'});
          $('pc').onclick=()=>{const n=$('pn').value.trim();if(n){S.lists.push({n,ids:[]});$('pn').value='';save();draw()}};
          document.onclick=e=>{const t=e.target;if(t.dataset.p)play(+t.dataset.p,S.songs.map(x=>x.id));if(t.dataset.fs!==undefined)tf(S.songs[+t.dataset.fs].id);if(t.dataset.fp!==undefined)play(+t.dataset.fp,FV());if(t.dataset.fr!==undefined)tf(FV()[+t.dataset.fr]);if(t.dataset.r){const x=RES[t.dataset.r];x.save?dl(x.u,x.n,x.by):playUrl(x.u,x.n)}if(t.dataset.pi){const[j,i]=t.dataset.pi.split(',');play(+i,[...S.lists[j].ids])}if(t.dataset.rm){const[j,i]=t.dataset.rm.split(',');S.lists[j].ids.splice(+i,1);save();draw()}if(t.dataset.hp)play(+t.dataset.hp,S.hist.filter(i=>S.songs.some(x=>x.id==i)));if(t.dataset.x!==undefined){if(t.textContent=='Apagar'){t.textContent='Tem certeza?';setTimeout(draw,3000)}else{S.lists.splice(+t.dataset.x,1);save();draw()}}if(t.dataset.ds!==undefined){if(t.textContent=='✕'){t.textContent='Apagar?';setTimeout(draw,3000)}else delSong(S.songs[+t.dataset.ds].id)}if(t.dataset.l){const l=S.lists[t.dataset.l];if(l.ids.length)play(0,[...l.ids])}};
          document.onchange=e=>{const t=e.target;if(t.dataset.a&&t.value!==''){const l=S.lists[t.value];if(!l.ids.includes(t.dataset.a))l.ids.push(t.dataset.a);save();draw()}};
          function draw(){const cur=Q[qi],nm=id=>(S.songs.find(x=>x.id==id)||{n:'?'}).n,lk=S.fav.includes(cur);
          $('fv').textContent=lk?'♥':'♡';$('fv').classList.toggle('on',lk);
          $('sl').innerHTML=S.songs.length?S.songs.map((s,i)=>`<li class="${s.id==cur?'now':''}"><button class="nm" data-p="${i}">${esc(s.n)}</button><button class="hb" data-fs="${i}">${S.fav.includes(s.id)?'♥':'♡'}</button><select data-a="${s.id}"><option value="">＋ playlist</option>${S.lists.map((l,j)=>`<option value="${j}">${esc(l.n)}</option>`).join('')}</select><button class="rm" data-ds="${i}">✕</button></li>`).join(''):'<li class="empty">Nenhuma música ainda. Toque em Adicionar músicas e escolha arquivos do celular.</li>';
          $('ll').innerHTML=S.lists.length?S.lists.map((l,j)=>`<li><b class="nm">${esc(l.n)}</b><button class="go" data-l="${j}">Tocar</button><button class="rm" data-x="${j}">Apagar</button><div class="tr">${l.ids.length?l.ids.map((id,i)=>`<div class="tk"><button class="nm" data-pi="${j},${i}">${esc(nm(id))}</button><button class="rm" data-rm="${j},${i}">✕</button></div>`).join(''):'Vazia. Use ＋ playlist na aba Músicas.'}</div></li>`).join(''):'<li class="empty">Crie sua primeira playlist.</li>';
          const FI=FV();$('fl').innerHTML=FI.length?FI.map((id,i)=>`<li class="${id==cur?'now':''}"><button class="nm" data-fp="${i}">♥ ${esc(nm(id))}</button><button class="rm" data-fr="${i}">✕</button></li>`).join(''):'<li class="empty">Nenhuma favorita ainda. Toque no ♡ ao lado de uma música.</li>';
          const H=S.hist.filter(i=>S.songs.some(x=>x.id==i));$('hl').innerHTML=H.length?H.map((id,i)=>`<li><button class="nm" data-hp="${i}">${esc(nm(id))}</button></li>`).join(''):'<li class="empty">Nada ouvido ainda. As músicas que você tocar aparecem aqui.</li>'}
          function delSong(id){S.songs=S.songs.filter(x=>x.id!=id);S.fav=S.fav.filter(x=>x!=id);S.lists.forEach(l=>l.ids=l.ids.filter(x=>x!=id));S.hist=S.hist.filter(x=>x!=id);delete B[id];try{db.transaction('b','readwrite').objectStore('b').delete(id)}catch(e){}save();draw()}
          let RES=[],jid=0;const pend={},st=t=>{$('dst').textContent=t};
          try{$('djk').value=localStorage.jk||''}catch(e){}
          function playUrl(u,n){Q=[];qi=-1;au.src=u;au.play();$('t').textContent=n;$('a').textContent='Ouvindo online';draw()}
          function dl(u,n,by){const id='d'+(++jid)+Date.now();pend[id]={n,by};st('Baixando '+n+'...');Android.get(u,id)}
          function gmDone(id,r){const p=pend[id],n=p.n;delete pend[id];if(!r.ok){st('Erro: '+r.err);return}
          st('Salvando...');let off=0;const P=[],L=393216;
          (function nx(){const s=Android.chunk(id,off,L);if(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);P.push(u);off+=b.length;if(off<r.size)return setTimeout(nx,0)}
          Android.del(id);if(!off){st('Erro ao salvar o arquivo');return}
          const sid=Date.now()+Math.random().toString(36).slice(2,6);put(sid,new Blob(P,{type:/^audio/.test(r.type)?r.type:'audio/mpeg'}));S.songs.push({id:sid,n:p.by?n+' - '+p.by:n,t:n,by:p.by||''});save();draw();st('Pronto: '+n+' (aba Músicas)')})()}
          $('dgo').onclick=()=>{const u=$('dlk').value.trim();if(!/^https?:\/\//i.test(u)){st('Cole um link que comece com http');return}let n='Música';try{n=decodeURIComponent(u.split('?')[0].split('/').pop()).replace(/\.[^.]+$/,'')||n}catch(e){}dl(u,n)};
          $('dbs').onclick=async()=>{const q=$('dq').value.trim(),j=$('djk').value.trim();if(!q)return;try{localStorage.jk=j}catch(e){}st('Buscando...');$('dres').innerHTML='';
          try{let R=[];
          if($('dso').value=='a'){const r=await(await fetch('https://api.audius.co/v1/tracks/search?limit=15&app_name=GengarMusic&query='+encodeURIComponent(q))).json();R=(r.data||[]).map(t=>({n:t.title,by:t.user&&t.user.name,u:'https://api.audius.co/v1/tracks/'+t.id+'/stream?app_name=GengarMusic'}))}
          else{if(!j){st('Cole sua chave (client_id) do Jamendo.');return}const r=await(await fetch('https://api.jamendo.com/v3.0/tracks/?format=json&limit=15&audiodlformat=mp32&client_id='+encodeURIComponent(j)+'&search='+encodeURIComponent(q))).json();R=(r.results||[]).filter(t=>t.audiodownload_allowed&&t.audiodownload).map(t=>({n:t.name,by:t.artist_name,u:t.audiodownload,save:1}))}
          RES=R;st(R.length?R.length+' resultados':'Nada encontrado.');
          $('dres').innerHTML=R.map((t,i)=>`<li><span class="nm">${esc(t.n||'')}<small> ${esc(t.by||'')}</small></span><button class="go" data-r="${i}">${t.save?'Baixar':'Ouvir'}</button></li>`).join('')}catch(e){st('Erro na busca. Confira a internet e a chave.')}};
          $('hc').onclick=()=>{S.hist=[];save();draw()};
          draw();setTimeout(sendArt,400);
          </script></body></html>
          EOF
      - name: Compilar
        working-directory: gm
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Gengar-Music-APK
          path: gm/app/build/outputs/apk/debug/app-debug.apk
